; Kaleido Klear ads configuration (see docs/ads.md).
; ONLY Google's public demo IDs live here until real AdMob units exist.
; Never put live IDs in debug builds: clicking live ads can get the account banned.

[ads]
; true = always use [ids_test], even in release builds. Keep true until real IDs exist.
force_test_ids=true
; Debug builds (OS.is_debug_build()) ALWAYS use [ids_test], whatever force_test_ids says.
; Optional UMP debug geography for debug builds: "", "EEA" or "NOT_EEA".
; Only takes effect on devices listed in ump_test_device_hashed_ids (or emulators).
ump_debug_geography=""
ump_test_device_hashed_ids=PackedStringArray()
; AdMob RequestConfiguration test devices (hashed device IDs from logcat).
admob_test_device_ids=PackedStringArray()
; Child-safe ad content (brief section 4.6).
max_ad_content_rating="G"

[ids_test]
; https://developers.google.com/admob/android/test-ads
app_id="ca-app-pub-3940256099942544~3347511713"
interstitial="ca-app-pub-3940256099942544/1033173712"

[ids_live]
; Fill in once the AdMob app exists. Empty interstitial = no ads in release builds.
; The manifest app ID comes from project setting admob/general/android/app_id (project.godot);
; keep it in sync with app_id here.
app_id=""
interstitial=""

[billing]
remove_ads_product_id="remove_ads"
